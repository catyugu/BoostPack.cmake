name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Run one test suite
        type: choice
        options: [smoke, compatibility, benchmark]
        default: smoke
      boost_version:
        description: Boost release for compatibility tests
        type: string
        default: '1.92.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'smoke'
    name: Smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check minimum CMake version
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install --upgrade cmake==3.22.6
      - name: Offline resolver, mirrors and lockfiles
        run: |
          cmake -S . -B build/unit -DBUILD_TESTING=ON
          ctest --test-dir build/unit -C Release --output-on-failure
      - uses: actions/cache@v4
        with:
          path: .boostpack-cache
          key: boostpack-smoke-${{ runner.os }}-1.92.0
      - name: Configure native Boost targets
        run: cmake -S examples/json -B build/json -DBOOSTPACK_CACHE_DIR="${{ github.workspace }}/.boostpack-cache"
      - name: Build and test real Boost modules
        run: |
          cmake --build build/json --config Release --parallel 2
          ctest --test-dir build/json -C Release --output-on-failure

  manual:
    if: github.event_name == 'workflow_dispatch' && inputs.suite != 'smoke'
    name: Manual / ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        if: inputs.suite == 'compatibility'
        with:
          path: .boostpack-cache
          key: boostpack-compat-${{ runner.os }}-${{ inputs.boost_version }}
      - name: Extended compatibility
        if: inputs.suite == 'compatibility'
        env:
          BOOST_RELEASE: ${{ inputs.boost_version }}
        run: |
          cmake -S tests/integration -B build/compatibility \
            "-DBOOST_VERSION=${BOOST_RELEASE}" \
            -DBOOSTPACK_CACHE_DIR="${{ github.workspace }}/.boostpack-cache" \
            -DBOOSTPACK_INTEGRATION_EXTENDED=ON
          cmake --build build/compatibility --config Release --parallel 2
          ctest --test-dir build/compatibility -C Release --output-on-failure
      - name: Resolver benchmark
        if: inputs.suite == 'benchmark'
        run: |
          python -m pip install --upgrade cmake==3.22.6
          cmake -DBENCH_ROOT="${{ github.workspace }}/build/benchmark" -P tests/benchmark/run.cmake
      - uses: actions/upload-artifact@v4
        if: inputs.suite == 'benchmark'
        with:
          name: boostpack-resolver-benchmark
          path: build/benchmark/results.csv
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.suite == 'smoke')
    needs: smoke
    name: Publish validated tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^# BoostPack\.cmake v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' cmake/BoostPack.cmake)
          project_version=$(sed -nE 's/^project\(BoostPack VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)
          test -n "$version" && test "$version" = "$project_version"
          test "$GITHUB_REF_NAME" = "v${version}"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Publish standalone file
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" cmake/BoostPack.cmake \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
