name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit and integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Check minimum supported CMake
        if: matrix.os == 'ubuntu-latest'
        run: python -m pip install --upgrade cmake==3.22.6
      - uses: actions/cache@v4
        with:
          path: .boostpack-cache
          key: boostpack-ci-${{ runner.os }}-1.89-1.92
      - uses: ./.github/actions/build-parallelism
      - name: Configure and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/tests -G Ninja -DBUILD_TESTING=ON
          cmake -E env CMAKE_GENERATOR=Ninja \
            ctest --test-dir build/tests -C Release \
              --output-on-failure --parallel 4 --timeout 35 --stop-on-failure
      - name: Configure and run Boost integration tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/integration -B build/integration \
            -DBOOSTPACK_CACHE_DIR="$GITHUB_WORKSPACE/.boostpack-cache"
          cmake --build build/integration --config Release
          ctest --test-dir build/integration -C Release --output-on-failure
