name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit / ${{ matrix.os }} / CMake ${{ matrix.cmake }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmake: '3.22.6'
          - os: ubuntu-latest
            cmake: system
          - os: windows-latest
            cmake: system
          - os: macos-latest
            cmake: system
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum CMake
        if: matrix.cmake != 'system'
        run: python -m pip install --upgrade cmake==${{ matrix.cmake }}
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Test
        run: ctest --test-dir build --output-on-failure

  integration:
    name: Boost 1.92 integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .boostpack-cache
          key: boostpack-1.92.0-${{ runner.os }}-sources
      - name: Configure with real Boost sources
        shell: bash
        run: >-
          cmake -S tests/integration -B build/integration
          -DBOOSTPACK_CACHE_DIR="${GITHUB_WORKSPACE}/.boostpack-cache"
      - name: Build
        run: cmake --build build/integration --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/integration -C Release --output-on-failure

  release:
    name: Publish versioned single-file release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release only when version is new
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^# BoostPack\.cmake v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' cmake/BoostPack.cmake)
          project_version=$(sed -nE 's/^project\(BoostPack VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)
          test -n "$version" && test "$version" = "$project_version"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if test "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA"; then
              echo "Tag $tag already points to another commit" >&2
              exit 1
            fi
          fi
          gh release create "$tag" cmake/BoostPack.cmake \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes
