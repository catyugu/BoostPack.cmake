name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata generation and upstream verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test metadata generator
        run: python tools/test_metadata.py
      - name: Verify committed manifest matches embedded CMake
        run: python tools/generate_metadata.py --check
      - name: Compare manifest against pinned Boost upstream CMake
        run: python tools/generate_metadata.py --verify-upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: Configure / ${{ matrix.os }} / CMake ${{ matrix.cmake }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmake: '3.22.6'
          - os: ubuntu-latest
            cmake: system
          - os: windows-latest
            cmake: system
          - os: macos-latest
            cmake: system
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum CMake
        if: matrix.cmake != 'system'
        run: python -m pip install --upgrade cmake==${{ matrix.cmake }}
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  integration:
    name: Real Boost / ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.cmake }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmake: '3.22.6'
            compiler: gcc
            shared: 'OFF'
          - os: ubuntu-latest
            cmake: system
            compiler: clang
            shared: 'OFF'
          - os: ubuntu-latest
            cmake: system
            compiler: gcc
            shared: 'ON'
          - os: windows-latest
            cmake: system
            compiler: msvc
            shared: 'OFF'
          - os: macos-latest
            cmake: system
            compiler: appleclang
            shared: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum CMake
        if: matrix.cmake != 'system'
        run: python -m pip install --upgrade cmake==${{ matrix.cmake }}
      - uses: actions/cache@v4
        with:
          path: .boostpack-cache
          key: boostpack-1.92.0-v02-${{ runner.os }}-sources
      - name: Configure real Boost sources
        shell: bash
        run: >-
          cmake -S tests/integration -B build/integration
          -DBOOSTPACK_CACHE_DIR="${GITHUB_WORKSPACE}/.boostpack-cache"
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          ${{ matrix.compiler == 'clang' && '-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang' || '' }}
      - name: Build
        run: cmake --build build/integration --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/integration -C Release --output-on-failure
      - name: Configure JSON example with CMake 3.22
        if: matrix.cmake == '3.22.6'
        shell: bash
        run: >-
          cmake -S examples/json -B build/example-json
          -DBOOSTPACK_CACHE_DIR="${GITHUB_WORKSPACE}/.boostpack-cache"
      - name: Build JSON example
        if: matrix.cmake == '3.22.6'
        run: cmake --build build/example-json --config Release --parallel 2
      - name: Test JSON example
        if: matrix.cmake == '3.22.6'
        run: ctest --test-dir build/example-json -C Release --output-on-failure

  release:
    name: Publish versioned single-file release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [metadata, unit, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release only when version is new
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^# BoostPack\.cmake v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' cmake/BoostPack.cmake)
          project_version=$(sed -nE 's/^project\(BoostPack VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)
          test -n "$version" && test "$version" = "$project_version"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          git fetch --tags
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if test "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA"; then
              echo "Tag $tag already points to another commit" >&2
              exit 1
            fi
          fi
          gh release create "$tag" cmake/BoostPack.cmake \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes
