name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit / ${{ matrix.os }} / CMake ${{ matrix.cmake }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmake: '3.22.6'
          - os: ubuntu-latest
            cmake: system
          - os: windows-latest
            cmake: system
          - os: macos-latest
            cmake: system
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake 3.22
        if: matrix.cmake != 'system'
        run: python -m pip install --upgrade cmake==${{ matrix.cmake }}
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  integration:
    name: Boost ${{ matrix.version }} / ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.cmake }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmake: '3.22.6'
            compiler: gcc
            version: '1.89.0'
            shared: 'OFF'
          - os: ubuntu-latest
            cmake: system
            compiler: clang
            version: '1.92.0'
            shared: 'OFF'
          - os: ubuntu-latest
            cmake: system
            compiler: gcc
            version: '1.92.0'
            shared: 'ON'
          - os: windows-latest
            cmake: system
            compiler: msvc
            version: '1.92.0'
            shared: 'OFF'
          - os: macos-latest
            cmake: system
            compiler: appleclang
            version: '1.92.0'
            shared: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake 3.22
        if: matrix.cmake != 'system'
        run: python -m pip install --upgrade cmake==${{ matrix.cmake }}
      - uses: actions/cache@v4
        with:
          path: .boostpack-cache
          key: boostpack-dynamic-${{ matrix.version }}-${{ runner.os }}-source
      - name: Configure real Boost modules
        shell: bash
        run: |
          args=()
          if [[ "${{ matrix.compiler }}" == "clang" ]]; then
            args+=(-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang)
          fi
          for attempt in 1 2 3; do
            if cmake -S tests/integration -B build/integration \
              -DBOOST_VERSION=${{ matrix.version }} \
              -DBOOSTPACK_CACHE_DIR="${GITHUB_WORKSPACE}/.boostpack-cache" \
              -DBUILD_SHARED_LIBS=${{ matrix.shared }} "${args[@]}"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "Boost archive fetch failed; retrying configuration ($attempt/3)"
            sleep 8
          done
      - name: Build
        run: cmake --build build/integration --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/integration -C Release --output-on-failure
      - name: Configure custom-version example
        if: matrix.cmake == '3.22.6'
        shell: bash
        run: >-
          cmake -S examples/custom-version -B build/example-version
          -DBOOST_VERSION=${{ matrix.version }}
          -DBOOSTPACK_CACHE_DIR="${GITHUB_WORKSPACE}/.boostpack-cache"
      - name: Build custom-version example
        if: matrix.cmake == '3.22.6'
        run: cmake --build build/example-version --config Release --parallel 2
      - name: Test custom-version example
        if: matrix.cmake == '3.22.6'
        run: ctest --test-dir build/example-version -C Release --output-on-failure

  mirror:
    name: Custom archive URL / CMake 3.22 / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake 3.22
        run: python -m pip install --upgrade cmake==3.22.6
      - name: Configure via codeload URL template
        run: >-
          cmake -S examples/custom-version -B build/mirror
          -DBOOST_VERSION=1.92.0
          -DBOOSTPACK_URL_TEMPLATE=https://codeload.github.com/boostorg/@MODULE@/tar.gz/refs/tags/@TAG@
      - name: Build
        run: cmake --build build/mirror --parallel 2
      - name: Test
        run: ctest --test-dir build/mirror --output-on-failure

  release:
    name: Publish corrected v0.2.0 single-file release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, integration, mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish after successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^# BoostPack\.cmake v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' cmake/BoostPack.cmake)
          project_version=$(sed -nE 's/^project\(BoostPack VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)
          test -n "$version" && test "$version" = "$project_version"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            published=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')
            if test "$published" = "$GITHUB_SHA"; then
              echo "Release $tag already corresponds to this commit"
              exit 0
            fi
            # The earlier v0.2.0 was released before dynamic resolution was
            # implemented. Replace exactly that known legacy revision once.
            if test "$tag" = "v0.2.0" && \
               test "$published" = "d194384143c152ab5c988ce3fa6e8e031488bc28"; then
              gh release delete "$tag" --yes --cleanup-tag
            else
              echo "Refusing to replace an unrelated existing release $tag" >&2
              exit 1
            fi
          fi
          gh release create "$tag" cmake/BoostPack.cmake \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes