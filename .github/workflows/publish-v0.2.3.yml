name: Publish v0.2.3 once

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Tag validated v0.2.3 and dispatch tagged CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 953b471ec0f50b988ff2e110fffc4ce7007ae17c
          VALIDATED_RUN: 44665576979
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          test "$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN" --jq '.head_sha')" = "$RELEASE_SHA"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN" --jq '.conclusion')" = success
          git show "$RELEASE_SHA:CMakeLists.txt" | grep -Fxq 'project(BoostPack VERSION 0.2.3 LANGUAGES CXX)'
          test "$(git show "$RELEASE_SHA:cmake/BoostPack.cmake" | head -n 1)" = '# BoostPack.cmake v0.2.3'

          if git show-ref --verify --quiet refs/tags/v0.2.3; then
            test "$(git rev-parse 'refs/tags/v0.2.3^{commit}')" = "$RELEASE_SHA"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a v0.2.3 -m 'BoostPack v0.2.3' "$RELEASE_SHA"
            git push origin refs/tags/v0.2.3
          fi

          if gh release view v0.2.3 >/dev/null 2>&1; then
            echo 'v0.2.3 already published'
          else
            # Actions GITHUB_TOKEN pushes do not start push workflows.
            gh workflow run ci.yml --ref v0.2.3
            echo 'Dispatched tagged CI; it publishes after all tests pass'
          fi
