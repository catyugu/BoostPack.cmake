name: Publish v0.2.1

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify the tested main commit and release version
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          grep -Fxq 'project(BoostPack VERSION 0.2.1 LANGUAGES CXX)' CMakeLists.txt
          grep -Fxq '# BoostPack.cmake v0.2.1' cmake/BoostPack.cmake
      - name: Tag and publish v0.2.1 if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.1 >/dev/null 2>&1; then
            echo 'v0.2.1 is already released'
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.2.1 >/dev/null 2>&1; then
            echo 'v0.2.1 tag already exists; using existing tag'
          else
            git tag -a v0.2.1 -m 'BoostPack v0.2.1'
            git push origin refs/tags/v0.2.1
          fi
          gh release create v0.2.1 cmake/BoostPack.cmake --verify-tag --title v0.2.1 --generate-notes
