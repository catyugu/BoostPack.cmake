name: Backfill v0.2.1 and v0.2.2 releases

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  backfill:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Tag validated versions and dispatch tagged CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]]; then
            echo "Skipping release backfill: a newer main commit is present"
            exit 0
          fi

          for spec in \
            "v0.2.1|8de8d1b140d3539c6b7eda5db46066399c4b7ec6|44586952806" \
            "v0.2.2|e98edaa74a5dbe9dbbe90c01d95236e21a80cc02|44658788647"; do
            IFS='|' read -r tag sha ci_run <<< "$spec"
            version="$(printf '%s' "$tag" | cut -c 2-)"
            git merge-base --is-ancestor "$sha" HEAD
            git show "$sha:CMakeLists.txt" | grep -Fxq "project(BoostPack VERSION $version LANGUAGES CXX)"
            [[ "$(git show "$sha:cmake/BoostPack.cmake" | head -n 1)" == "# BoostPack.cmake $tag" ]]
            [[ "$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ci_run" --jq '.conclusion')" == success ]]

            if git show-ref --verify --quiet "refs/tags/$tag"; then
              [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$sha" ]]
            else
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  tag -a "$tag" -m "BoostPack $tag" "$sha"
              git push origin "refs/tags/$tag"
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released"
            else
              # Pushes with GITHUB_TOKEN do not trigger push workflows.
              # workflow_dispatch on the tag runs the existing full CI and
              # creates the release only after the complete matrix succeeds.
              gh workflow run ci.yml --ref "$tag"
              echo "Started tagged CI for $tag"
            fi
          done
