name: Manual

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Optional test suite
        type: choice
        required: true
        options: [compatibility, benchmark]
      boost_version:
        description: Boost release for compatibility testing
        type: string
        default: '1.92.0'

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        if: inputs.suite == 'compatibility'
        with:
          path: .boostpack-cache
          key: boostpack-compat-${{ runner.os }}-${{ inputs.boost_version }}
      - name: Use all available logical cores for C++ builds
        if: inputs.suite == 'compatibility'
        shell: bash
        run: |
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" >> "$GITHUB_ENV"
      - name: Extended compatibility
        if: inputs.suite == 'compatibility'
        env:
          BOOST_RELEASE: ${{ inputs.boost_version }}
        run: |
          set -euo pipefail
          cmake -S tests/integration -B build/compatibility \
            "-DBOOST_VERSION=${BOOST_RELEASE}" \
            -DBOOSTPACK_CACHE_DIR="${{ github.workspace }}/.boostpack-cache" \
            -DBOOSTPACK_INTEGRATION_EXTENDED=ON
          cmake --build build/compatibility --config Release
          ctest --test-dir build/compatibility -C Release --output-on-failure
      - name: Resolver benchmark
        if: inputs.suite == 'benchmark'
        run: |
          python -m pip install --upgrade cmake==3.22.6
          cmake -DBENCH_ROOT="${{ github.workspace }}/build/benchmark" -P tests/benchmark/run.cmake
      - uses: actions/upload-artifact@v4
        if: inputs.suite == 'benchmark'
        with:
          name: boostpack-resolver-benchmark
          path: build/benchmark/results.csv
          if-no-files-found: error
