name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    name: Tag and publish tested main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Tag and publish if not already released
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          # Never release a superseded CI run.
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "main advanced since CI passed; skipping obsolete release"
            exit 0
          fi

          version=$(sed -nE 's/^# BoostPack\.cmake v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' cmake/BoostPack.cmake)
          project_version=$(sed -nE 's/^project\(BoostPack VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES NONE\)$/\1/p' CMakeLists.txt)
          test -n "$version" && test "$version" = "$project_version"
          tag="v${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)"
          else
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              tag -a "$tag" -m "BoostPack.cmake $tag"
            git push origin "refs/tags/$tag"
          fi

          gh release create "$tag" cmake/BoostPack.cmake \
            --verify-tag --title "$tag" --generate-notes
