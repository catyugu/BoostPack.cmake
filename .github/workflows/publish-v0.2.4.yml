name: Publish v0.2.4 once

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Tag validated v0.2.4 and dispatch release CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_SHA: 63179271b0468dd73c3271905ba142a3d0882862
        run: |
          set -euo pipefail
          # Only act on a successful CI run of the currently checked-out main.
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          git show "$RELEASE_SHA:CMakeLists.txt" | grep -Fxq 'project(BoostPack VERSION 0.2.4 LANGUAGES CXX)'
          test "$(git show "$RELEASE_SHA:cmake/BoostPack.cmake" | head -n 1)" = '# BoostPack.cmake v0.2.4'

          if git show-ref --verify --quiet refs/tags/v0.2.4; then
            test "$(git rev-parse 'refs/tags/v0.2.4^{commit}')" = "$RELEASE_SHA"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a v0.2.4 -m 'BoostPack v0.2.4' "$RELEASE_SHA"
            git push origin refs/tags/v0.2.4
          fi

          if gh release view v0.2.4 >/dev/null 2>&1; then
            echo 'v0.2.4 already released'
          else
            # GITHUB_TOKEN tag pushes do not trigger push workflows.
            gh workflow run ci.yml --ref v0.2.4
            echo 'Dispatched tagged CI; it publishes after all required checks pass'
          fi
